<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>练记 · 健身房训练日志</title>
<style>
:root{font-family:system-ui,'Microsoft YaHei',sans-serif;color:#20322d;background:#f5f6f3}
*{box-sizing:border-box}body{margin:0}main{max-width:920px;margin:auto;padding:28px 22px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.brand{font-size:22px;font-weight:800}.tag{font-size:12px;color:#778078}
p{color:#69746c;line-height:1.6}.layout{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:start}
.card{min-width:0;background:white;border:1px solid #e1e6de;border-radius:14px;padding:22px}h2{font-size:17px;margin:0 0 18px}
label{display:block;font-size:13px;margin:14px 0 6px}input,button,select{font:inherit}input,select{width:100%;min-width:0;padding:10px 11px;border:1px solid #d6ddd3;border-radius:7px;background:white;color:inherit;font-size:15px}
input:focus,select:focus,button:focus-visible,summary:focus-visible{outline:2px solid #48775b;outline-offset:2px}
button{cursor:pointer;border:0;border-radius:7px;padding:10px 14px;background:#234e3b;color:white;font-size:14px}button.secondary{background:#edf1e9;color:#345840}button:disabled{cursor:not-allowed;background:#eef0eb;color:#9aa196}
.text-button{background:transparent;color:#738071;padding:8px 3px;text-decoration:none}.text-button:disabled{visibility:hidden}
form>button[type=submit]{width:100%;margin-top:18px;font-weight:600}.hint{font-size:12px;margin:8px 0;overflow-wrap:anywhere}.hint:empty{display:none}.error,#message.error{color:#a52c23}#message{color:#22543b}
summary{cursor:pointer;color:#596a5d;font-size:13px;padding:3px 0;user-select:none}details[open]>summary{margin-bottom:12px}.template-panel{border-bottom:1px solid #edf0e9;padding-bottom:14px;margin-bottom:16px}.disclosure-body{padding-top:1px}.button-row{display:flex;gap:8px;margin-top:8px}#save-template{margin-top:10px;width:100%}
.exercise-card{min-width:0;border:0;border-top:1px solid #e5e9e2;border-radius:0;padding:16px 0 0;margin:18px 0}.exercise-card legend{display:none}.exercise-heading{display:flex;align-items:center;justify-content:space-between;gap:8px}.exercise-heading label{margin:0 0 6px}.exercise-heading button{font-size:12px;flex-shrink:0;padding:3px}
.set-headers,.set-row{display:grid;grid-template-columns:24px minmax(0,1fr) minmax(0,1fr) 36px;gap:8px;align-items:center}.set-headers{font-size:12px;color:#7a847b;margin:14px 0 7px}.set-row{margin-bottom:8px}.set-row input{padding:10px 8px}.set-number{text-align:center;font-size:12px;color:#7a847b}.set-row button{font-size:12px;padding:10px 2px}.add-set{background:transparent!important;font-size:13px;padding:6px 0}.reuse-previous{font-size:12px;padding:5px 8px;background:transparent!important;text-decoration:underline}.previous{margin:7px 0 0}#add-exercise{width:100%;background:white;border:1px dashed #cdd6c8;color:#536b56}
.history-filters{margin-top:-5px}.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.filters label{margin-top:0}.filters button{grid-column:1/-1}.summary{display:flex;flex-wrap:wrap;gap:6px 14px;margin:16px 0;font-size:12px;color:#788275}.summary span{white-space:nowrap}
.date-heading{margin:20px 0 10px;font-size:13px;color:#64755f}.entry{border-top:1px solid #edf0e9;padding:12px 0 4px}.entry strong{display:block;font-size:14px;margin:0 0 6px}.history-set{display:grid;grid-template-columns:48px 1fr 32px;align-items:center;gap:5px;font-size:13px;min-height:32px}.history-set>span:first-child{color:#8b9488;font-size:12px}.entry .remove{background:none;color:#929b8f;font-size:12px;padding:8px 0}.empty{padding:14px 0;font-size:13px}
.backup-panel{margin-top:20px;padding:0 3px}.backup-panel[open]{background:white;border:1px solid #e1e6de;border-radius:12px;padding:16px}.backup-panel h2{display:none}#backup-controls p{font-size:13px}.backup-panel button{margin-right:8px}footer{font-size:11px;color:#899181;line-height:1.6;margin-top:20px;max-width:620px}
@media(max-width:650px){main{padding:20px 16px}.layout{grid-template-columns:1fr;gap:16px}.card{padding:18px}header{margin-bottom:20px}.tag{font-size:11px}.set-headers,.set-row{gap:7px}}
@media(max-width:350px){main{padding:16px 12px}.card{padding:15px}.set-headers,.set-row{gap:5px;grid-template-columns:20px minmax(0,1fr) minmax(0,1fr) 30px}}
</style>
<style>
main{max-width:1100px;padding-top:36px} header{padding-bottom:18px;border-bottom:1px solid #dce4da}.brand{font-size:25px;letter-spacing:-.04em}.tag{font-size:13px}.layout{grid-template-columns:minmax(0,1.12fr) minmax(0,.88fr);gap:24px}.card{border:0;border-radius:10px;padding:26px;background:#fff} h2{font-size:20px;letter-spacing:-.02em}.exercise-card{margin-top:22px}.set-headers{font-weight:600}.set-row input{min-height:44px}button{min-height:42px;font-weight:600}.text-button,.remove,.add-set,.reuse-previous{min-height:36px}.summary{padding:12px 0;color:#405c4a;font-size:13px}.date-heading{font-size:14px;color:#314b39}.history-set{grid-template-columns:48px 1fr auto auto;gap:8px;min-height:42px}.history-set .edit{background:none;color:#356a4c;padding:6px}.edit-fields{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.edit-fields input{width:95px}.timer{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#edf2ea;border-radius:8px;padding:12px;margin:18px 0}.timer strong{font-size:20px;font-variant-numeric:tabular-nums;min-width:52px}.timer label{margin:0;font-size:13px}.timer select{width:auto;min-height:40px}.timer button{padding:8px 12px}.timer-status{font-size:12px;color:#52685a}.timer-status:empty{display:none}
@media(max-width:650px){main{padding:20px 16px}.layout{grid-template-columns:1fr;gap:16px}.card{padding:20px}.history-set{grid-template-columns:45px 1fr auto auto}.timer{gap:8px}}
@media(max-width:350px){main{padding:16px 12px}.card{padding:15px}.history-set{gap:4px}.history-set .edit,.entry .remove{padding:6px 2px}}
</style>
<style>
.set-headers,.set-row{grid-template-columns:24px minmax(0,1fr) minmax(0,1fr) 48px 38px;gap:6px}.set-row .complete-set{width:22px;height:22px;min-height:0;accent-color:#234e3b;justify-self:center}.set-row .set-type{grid-column:2/4;padding:5px 7px;font-size:12px;min-height:34px;width:auto}.set-row .remove-set{grid-column:5;grid-row:1}.set-row .complete-set{grid-column:4;grid-row:1}.exercise-note{margin-top:10px}.progress-panel{margin-top:20px}.progress-panel h3{font-size:15px}.progress-list{padding:0;list-style:none;font-size:13px}.progress-list li{padding:8px 0;display:grid;grid-template-columns:1fr auto;gap:6px 10px}.progress-bar{grid-column:1/-1;height:5px;background:#e8eee7}.progress-bar span{display:block;height:100%;background:#48775b}.draft-status{font-size:12px;color:#52685a}.draft-status:empty{display:none}@media(max-width:350px){.set-headers,.set-row{grid-template-columns:20px minmax(0,1fr) minmax(0,1fr) 36px 30px;gap:4px}}
</style>
<main>
<header><div class="brand">练记 <span style="color:#7b8a58">↗</span></div><span class="tag">每一组，都是积累。</span></header>

<div class="layout"><section class="card"><h2>今天的训练</h2>
<details class="template-panel"><summary>训练模板</summary><div class="disclosure-body">
<label for="template-select">选择模板</label><select id="template-select"><option value="">选择已保存的模板</option></select>
<div class="button-row"><button type="button" class="secondary" id="load-template">加载模板</button><button type="button" class="text-button" id="delete-template">删除模板</button></div>
<label for="template-name">模板名称</label><input id="template-name" maxlength="40" placeholder="例如：练胸日">
<button type="button" class="secondary" id="save-template">将下方动作保存为模板</button>
<p class="hint" id="template-message" role="status" aria-live="polite"></p></div></details>
<form id="form" novalidate><label for="date">训练日期</label><input type="date" id="date" required>
<datalist id="exercises"><option>杠铃卧推</option><option>深蹲</option><option>硬拉</option><option>高位下拉</option><option>坐姿划船</option><option>哑铃推肩</option></datalist>
<div id="exercise-cards"></div><button type="button" class="secondary" id="add-exercise">＋ 添加动作</button>
<p class="hint">完成一组后勾选，自动开始休息。若未勾选，保存时将记录所有填写的组。</p><p id="draft-status" class="draft-status" role="status"></p>
<div class="timer" aria-label="组间休息计时"><label for="rest-duration">组间休息</label><select id="rest-duration"><option value="60">60 秒</option><option value="90" selected>90 秒</option><option value="120">2 分钟</option><option value="180">3 分钟</option></select><strong id="rest-display">01:30</strong><button type="button" id="rest-toggle" class="secondary">开始计时</button><button type="button" id="rest-reset" class="text-button">重置</button><span id="rest-status" class="timer-status" role="status" aria-live="polite"></span></div>
<button type="submit">保存本次训练</button><p id="message" class="hint" role="status" aria-live="polite"></p></form></section>
<section class="card"><h2>训练历史</h2><details class="history-filters"><summary>筛选记录</summary><div class="filters"><div><label for="filter-date">按日期</label><input type="date" id="filter-date"></div><div><label for="filter-exercise">按动作</label><select id="filter-exercise"><option value="">全部动作</option></select></div><button type="button" class="secondary" id="clear-filters">清除筛选</button></div></details><details class="progress-panel"><summary>动作进步</summary><label for="progress-exercise">选择动作</label><select id="progress-exercise"><option value="">选择动作</option></select><div id="progress-result" aria-live="polite"></div></details><div id="summary" class="summary" aria-live="polite"></div><div id="history" aria-live="polite"></div></section></div>
<details class="backup-panel"><summary>备份与恢复</summary><section id="backup-controls" aria-label="备份与恢复"></section></details>
<footer>记录、模板和草稿仅保存在当前浏览器；清除浏览器数据会丢失。JSON 备份包含训练记录和模板，不含未保存草稿。重量请按同一口径填写，哑铃可记单只重量。</footer>
</main>
<script src="gym-training.js"></script>
<script src="gym-backup.js"></script>
</html>
