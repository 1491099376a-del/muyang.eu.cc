<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>练记 · 健身房训练日志</title>
<style>
:root{font-family:system-ui,'Microsoft YaHei',sans-serif;color:#20322d;background:#f3f5ef}*{box-sizing:border-box}body{margin:0}main{max-width:1000px;margin:auto;padding:36px 22px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:45px}.brand{font-size:23px;font-weight:800}.tag{font-size:13px;color:#64746a}h1{font-size:38px;letter-spacing:-1px;margin:0 0 12px}p{color:#64746a;line-height:1.7}.layout{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:30px}.card{background:white;border:1px solid #dce3d8;border-radius:20px;padding:26px}h2{font-size:20px;margin:0 0 22px}label{display:block;font-size:14px;margin:17px 0 7px}input,button{font:inherit}input{width:100%;padding:13px;border:1px solid #cbd4ca;border-radius:10px;background:#fafbf8;color:inherit}input:focus{outline:2px solid #48775b;outline-offset:2px}.row{display:grid;grid-template-columns:1fr 1fr;gap:15px}button{cursor:pointer;border:0;border-radius:10px;padding:13px 18px;background:#234e3b;color:white}form>button{width:100%;margin-top:22px;font-weight:700}.hint{font-size:13px;min-height:22px;margin:12px 0 0}.entry{border-top:1px solid #e5e9e2;padding:17px 0}.entry strong{display:block;margin:6px 0}.entry small{color:#64746a}.entry .remove{background:none;color:#6b726c;font-size:12px;padding:7px 0;text-decoration:underline}.empty{padding:35px 0;text-align:center}.badge{display:inline-block;background:#e4edc7;border-radius:20px;padding:7px 12px;font-size:12px;margin-bottom:18px}footer{font-size:12px;color:#64746a;margin-top:28px}#message{color:#22543b}#message.error{color:#a52c23}@media(max-width:650px){main{padding:24px 16px}.layout{grid-template-columns:1fr}header{margin-bottom:30px}h1{font-size:31px}.card{padding:21px}.tag{max-width:120px;text-align:right}}
</style>
<main>
<header><div class="brand">练记 <span style="color:#7b8a58">↗</span></div><span class="tag">每一组，都是积累。</span></header>
<span class="badge">GYM JOURNAL / 第一版</span><h1>把今天的努力，记下来。</h1><p>从一组开始。记录重量与次数，下次训练心里有数。</p>
<div class="layout"><section class="card"><h2>记录一组</h2>
<form id="form"><label for="date">训练日期</label><input type="date" id="date" required>
<label for="exercise">训练动作</label><input id="exercise" list="exercises" maxlength="60" placeholder="例如：杠铃卧推" required><datalist id="exercises"><option>杠铃卧推</option><option>深蹲</option><option>硬拉</option><option>高位下拉</option><option>坐姿划船</option><option>哑铃推肩</option></datalist>
<p class="hint" id="previous">选择动作后，查看最近一次记录。</p>
<div class="row"><div><label for="weight">重量 / kg</label><input id="weight" type="number" min="0" max="2000" step="0.25" placeholder="如 20" required></div><div><label for="reps">次数</label><input id="reps" type="number" min="1" max="1000" step="1" placeholder="如 10" required></div></div>
<button type="submit">＋ 保存这一组</button><p id="message" class="hint" role="status" aria-live="polite"></p></form></section>
<section class="card"><h2>训练历史 <span id="count" style="font-size:13px;color:#64746a;font-weight:400"></span></h2><div id="history"></div></section></div>
<footer>记录仅保存在当前浏览器；清除浏览器数据会丢失。重量请按同一口径填写，哑铃可记单只重量。</footer>
</main>
<script>
'use strict';
const key='gym-journal-v1';
const form=document.querySelector('#form'), history=document.querySelector('#history'), exercise=document.querySelector('#exercise'), message=document.querySelector('#message');
let records=[], storageReady=true;
const today=new Date();document.querySelector('#date').value=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
function notify(text,error=false){message.textContent=text;message.classList.toggle('error',error)}
try{const raw=localStorage.getItem(key);if(raw!==null){const parsed=JSON.parse(raw);if(!Array.isArray(parsed)||!parsed.every(r=>r&&typeof r.id==='string'&&typeof r.exercise==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(r.date)&&Number.isFinite(r.weight)&&r.weight>=0&&Number.isInteger(r.reps)&&r.reps>0))throw Error('invalid data');records=parsed}}catch{storageReady=false;notify('无法读取本地记录，请保留浏览器数据并检查存储权限。为保护原记录，已暂停保存。',true)}
function persist(next){if(!storageReady)return false;try{localStorage.setItem(key,JSON.stringify(next));records=next;return true}catch{notify('保存失败，请检查浏览器存储空间或权限。',true);return false}}
function previous(){const found=[...records].reverse().sort((a,b)=>b.date.localeCompare(a.date)).find(r=>r.exercise===exercise.value.trim());document.querySelector('#previous').textContent=found?`最近一次：${found.date} · ${found.weight} kg × ${found.reps} 次`:'这个动作还没有记录，从今天开始。'}
function render(){history.replaceChildren();document.querySelector('#count').textContent=`共 ${records.length} 组`;if(!records.length){const p=document.createElement('p');p.className='empty';p.textContent='还没有记录。保存第一组，开始积累。';history.append(p)}for(const r of [...records].reverse().sort((a,b)=>b.date.localeCompare(a.date))){const item=document.createElement('div');item.className='entry';const date=document.createElement('small');date.textContent=r.date;const title=document.createElement('strong');title.textContent=r.exercise;const detail=document.createElement('div');detail.textContent=`${r.weight} kg × ${r.reps} 次`;const remove=document.createElement('button');remove.type='button';remove.className='remove';remove.textContent='删除这组';remove.setAttribute('aria-label',`删除 ${r.date} ${r.exercise} ${r.weight} kg ${r.reps} 次`);remove.onclick=()=>{if(confirm('确定删除这组记录？')&&persist(records.filter(x=>x.id!==r.id))){render();notify('已删除这一组。')}};item.append(date,title,detail,remove);history.append(item)}previous()}
exercise.addEventListener('input',previous);
form.addEventListener('submit',e=>{e.preventDefault();if(!form.reportValidity())return;const name=exercise.value.trim();if(!name){notify('请填写训练动作。',true);return}const r={id:crypto.randomUUID(),date:document.querySelector('#date').value,exercise:name,weight:Number(document.querySelector('#weight').value),reps:Number(document.querySelector('#reps').value)};if(persist([...records,r])){render();notify('已保存！可以继续记录下一组。')}});
render();
</script>
</html>
